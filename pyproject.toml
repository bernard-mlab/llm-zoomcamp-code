[project]
name = "arxiv-research-assistant"
version = "0.1.0"
description = "arXiv AI research agent — LLM Zoomcamp final project (RAG + agent + eval + monitoring)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.51.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.4",
    "dlt[parallel]>=1.4.0",
    "requests>=2.32.3",
    "langfuse>=2.0,<3.0",
    "chainlit>=1.3.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "tqdm>=4.66.5",
    "sentence-transformers>=5.7.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3.3",
    "jupyterlab>=4.2.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_agent", "pipeline", "interface"]
