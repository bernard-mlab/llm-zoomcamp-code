# arxiv-research-assistant — full stack (colima / docker compose)
# qdrant + langfuse(self-hosted) + app(chainlit) + ingest(profile).
# Verified end-to-end in Phase 7 (Session 08). Langfuse service shape follows
# the official self-host compose.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant's image ships no curl/wget; CMD-SHELL defaults to /bin/sh
      # (dash, no /dev/tcp support) so bash must be invoked explicitly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Langfuse self-hosted stack ----
  postgres-langfuse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-minio
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-web:
    image: langfuse/langfuse:2
    depends_on:
      postgres-langfuse:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres-langfuse:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@clickhouse:9000/default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: 8237fe92aa7671a9b58aec5d6ff7f628c4ab4a3f7b129d544ed7cde68da7c139
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio-minio
      AWS_REGION: us-east-1
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: 2ef6564bb738c80b666a1cd6783f24b5d2c6a958ea8072f68b39119aef143968
      SALT: bb70cbd041b5f1cb9ad23112d1dc6b8240a5c61460f1ed347fa795753e776ae3

  langfuse-worker:
    image: langfuse/langfuse:2
    depends_on:
      postgres-langfuse:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres-langfuse:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@clickhouse:9000/default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_URL: redis://redis:6379
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio-minio
      AWS_REGION: us-east-1
      ENCRYPTION_KEY: 2ef6564bb738c80b666a1cd6783f24b5d2c6a958ea8072f68b39119aef143968
      SALT: bb70cbd041b5f1cb9ad23112d1dc6b8240a5c61460f1ed347fa795753e776ae3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse-web:3000
    command: ["uv", "run", "--locked", "--no-dev", "chainlit", "run", "interface/app.py", "--port", "8000", "--host", "0.0.0.0", "--headless"]

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ingest"]
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["uv", "run", "--locked", "--no-dev", "python", "-m", "pipeline.ingest"]

volumes:
  qdrant_data:
  langfuse_pg:
  clickhouse_data:
  minio_data: